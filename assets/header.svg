<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none">
  <title>Paul — Thoughtful tools for the Linux desktop</title>
  <desc>A dark Omarchy-inspired banner with clear typography, fine weather contours, and an expressive sun-and-cloud illustration.</desc>
  <defs>
